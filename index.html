<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
<title>Sketch Helper</title>

<!-- iOS home-screen app behavior (no manifest needed for this) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sketch Helper" />
<meta name="theme-color" content="#28405E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F2EEE3'/%3E%3Cpath d='M50 15 L80 35 L80 65 L50 85 L20 65 L20 35 Z' fill='none' stroke='%2328405E' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='5' fill='%238C6A45'/%3E%3C/svg%3E" />

<!-- Android / Chrome install -->
<link rel="manifest" href="manifest.json" />

<style>
  :root {
    --paper: #F2EEE3;
    --paper-dark: #E8E2D2;
    --ink: #212A38;
    --ink-soft: #5B6577;
    --blue: #3D5A80;
    --blue-deep: #28405E;
    --blue-line: #C7D4E0;
    --brass: #8C6A45;
    --danger: #A63D40;
    --white: #FFFDF8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100svh;
    width: 100%;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  button {
    font-family: var(--sans);
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
    margin: 0;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  input { font-family: var(--sans); -webkit-appearance: none; appearance: none; }
  button:disabled { cursor: default; }

  #sketchView { display: flex; flex-direction: column; height: 100%; }
  #leftCol { display: contents; }

  #canvasWrap {
    flex-basis: calc(30% - 101px);
    flex-shrink: 0;
    border-bottom: 2px solid var(--blue-deep);
    padding: 10px;
    background: var(--paper-dark);
  }
  #canvasInner {
    width: 100%; height: 100%;
    border: 1px solid var(--blue-line);
    border-radius: 3px;
    overflow: hidden;
  }
  #canvasInner svg { display: block; width: 100%; height: 100%; }

  #titleRow {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    flex-shrink: 0;
  }
  #titleInput {
    flex: 1;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 3px;
    border: 1px solid var(--blue-line);
    background: var(--white);
    color: var(--ink);
    outline: none;
  }
  #saveBtn {
    font-size: 14px; font-weight: 700;
    padding: 10px 16px;
    border-radius: 3px; border: none;
    background: var(--blue); color: var(--white);
    letter-spacing: 0.02em;
  }

  #bottomRow {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 10px 12px;
  }
  #bottomSpacer {
    flex-shrink: 0;
    height: 91px;
    pointer-events: none;
  }
  #pad {
    display: grid;
    grid-template-columns: 48px 48px 48px;
    grid-template-rows: 48px 48px 48px;
    gap: 6px;
  }
  .arrowBtn {
    width: 48px; height: 48px;
    font-size: 20px;
    border-radius: 3px;
    border: 1px solid var(--blue-deep);
    background: var(--blue); color: var(--white);
  }
  #numberInput {
    width: 48px; height: 48px;
    text-align: center;
    font-family: var(--mono);
    font-size: 16px; font-weight: 700;
    border-radius: 3px;
    border: 2px solid var(--brass);
    background: var(--white); color: var(--ink);
    outline: none;
  }
  #sideCol { display: flex; flex-direction: column; gap: 8px; order: 2; }
  #padCol { display: flex; flex-direction: column; align-items: center; gap: 6px; order: 1; }
  #sideCol button {
    font-size: 12px; font-weight: 600;
    padding: 10px 12px;
    border-radius: 3px;
  }
  #sketchesTabBtn {
    font-size: 13px !important;
    border: 1px solid var(--blue-deep);
    background: var(--paper); color: var(--blue-deep);
  }
  #undoClearRow { display: flex; gap: 4px; }
  #undoClearRow button {
    flex: 1; min-width: 0;
    font-size: 11px !important;
    padding: 10px 4px !important;
  }
  #undoBtn { border: 1px solid var(--blue-line); background: var(--paper); color: var(--ink); }
  #undoBtn:disabled { background: var(--paper-dark); color: var(--ink-soft); }
  #clearBtn { border: 1px solid var(--danger); background: var(--white); color: var(--danger); }
  #clearBtn:disabled { background: var(--paper-dark); color: var(--ink-soft); }
  #arcBtnRow { display: flex; gap: 6px; }
  #arcBtnRow button {
    width: 48px; height: 48px;
    border-radius: 3px;
    border: 1px solid var(--blue-deep);
    background: var(--blue); color: var(--white);
    display: flex; align-items: center; justify-content: center;
  }
  #arcBtnRow button:disabled { background: var(--paper-dark); color: var(--ink-soft); border-color: var(--blue-line); }

  #micBtn {
    border: 1px solid var(--blue-deep);
    background: var(--paper); color: var(--blue-deep);
    margin-top: 2px;
  }
  #micBtn.listening {
    background: var(--danger); border-color: var(--danger); color: var(--white);
    animation: micPulse 1.4s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  #snapToggleRow, #maintainArcToggleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 6px 4px 2px;
  }
  #snapToggleLabel, .snapToggleLabel {
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute; inset: 0;
    background: var(--blue-line);
    border-radius: 20px;
    transition: background 0.15s ease;
  }
  .switch .slider::before {
    content: "";
    position: absolute;
    height: 16px; width: 16px;
    left: 2px; top: 2px;
    background: var(--white);
    border-radius: 50%;
    transition: transform 0.15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .switch input:checked + .slider { background: var(--brass); }
  .switch input:checked + .slider::before { transform: translateX(14px); }

  /* Sketches view */
  #sketchesView { display: none; flex-direction: column; height: 100%; }
  #sketchesHeader {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 2px solid var(--blue-deep);
    background: var(--paper-dark);
    flex-shrink: 0;
  }
  #backBtn {
    font-size: 14px; font-weight: 600;
    padding: 8px 12px; border-radius: 3px;
    border: 1px solid var(--blue-deep);
    background: var(--paper); color: var(--blue-deep);
  }
  #sketchesCount {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft); flex: 1;
  }
  #sketchesActions {
    display: flex; gap: 8px; padding: 10px 14px;
    border-bottom: 1px solid var(--blue-line); flex-shrink: 0;
  }
  #sketchesActions button {
    font-size: 13px; font-weight: 600;
    padding: 9px 12px; border-radius: 3px; flex: 1;
  }
  #exportBtn { border: none; background: var(--blue); color: var(--white); }
  #deleteAllBtn { border: 1px solid var(--danger); background: var(--white); color: var(--danger); }
  #sketchesList { flex: 1; overflow-y: auto; padding: 12px; }
  .sketchRow {
    display: flex; align-items: center; gap: 10px;
    background: var(--white); border: 1px solid var(--blue-line);
    border-radius: 4px; padding: 8px; margin-bottom: 8px;
  }
  .sketchThumb {
    width: 56px; height: 56px; flex-shrink: 0;
    border-radius: 3px; overflow: hidden; border: 1px solid var(--blue-line);
  }
  .sketchThumb svg { display: block; width: 100%; height: 100%; }
  .sketchMeta { flex: 1; min-width: 0; }
  .sketchTitle {
    font-weight: 600; font-size: 15px; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sketchMeasurements {
    font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sketchDeleteBtn {
    font-size: 12px; font-weight: 600;
    padding: 7px 10px; border-radius: 3px;
    border: 1px solid var(--danger); background: var(--white); color: var(--danger);
    flex-shrink: 0;
  }
  .emptyState {
    font-family: var(--mono); font-size: 13px; color: var(--ink-soft);
    padding: 20px; text-align: center;
  }

  /* modal + toast */
  #modalOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(33,42,56,0.55);
    z-index: 50; align-items: center; justify-content: center; padding: 24px;
  }
  #modalBox {
    background: var(--white); border: 1px solid var(--blue-line);
    border-radius: 4px; padding: 20px 20px 16px; max-width: 320px; width: 100%;
    box-shadow: 0 12px 30px rgba(33,42,56,0.35);
  }
  #modalLabel {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    color: var(--danger); text-transform: uppercase; margin-bottom: 8px;
  }
  #modalMessage { font-size: 15px; color: var(--ink); margin-bottom: 18px; line-height: 1.4; }
  #modalActions { display: flex; gap: 8px; justify-content: flex-end; }
  #modalActions button { font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 3px; }
  #modalCancel { border: 1px solid var(--blue-line); background: var(--paper); color: var(--ink); }
  #modalConfirm { border: none; background: var(--danger); color: var(--white); }

  #exportOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(33,42,56,0.55);
    z-index: 55; align-items: center; justify-content: center; padding: 24px;
  }
  #exportBox {
    background: var(--white); border: 1px solid var(--blue-line);
    border-radius: 4px; padding: 20px; max-width: 420px; width: 100%;
    box-shadow: 0 12px 30px rgba(33,42,56,0.35);
  }
  #exportLabel {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    color: var(--blue-deep); text-transform: uppercase; margin-bottom: 6px;
  }
  #exportHint { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px; line-height: 1.4; }
  #exportTextarea {
    width: 100%; height: 140px;
    font-family: var(--mono); font-size: 12px;
    border: 1px solid var(--blue-line); border-radius: 3px;
    padding: 8px; resize: none; background: var(--paper); color: var(--ink);
  }
  #exportActions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  #exportActions button { font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 3px; }
  #exportCloseBtn { border: 1px solid var(--blue-line); background: var(--paper); color: var(--ink); }
  #exportCopyBtn { border: none; background: var(--blue); color: var(--white); }

  #toast {
    display: none;
    position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    background: var(--ink); color: var(--white);
    font-size: 13px; font-family: var(--mono);
    padding: 8px 16px; border-radius: 3px; z-index: 60;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    max-width: 85vw; text-align: center;
  }

  /* Landscape: sketch (+ title/save below it) on the left, arrow pad on
     the right, Sketches/Undo/Clear/Snap to Grid in a column between them. */
  @media (orientation: landscape) {
    #sketchView { flex-direction: row; }
    #leftCol {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      border-right: 2px solid var(--blue-deep);
    }
    #canvasWrap { flex: 1 1 0; min-height: 0; }
    #titleRow { flex-shrink: 0; }
    #bottomRow { flex: 0 0 auto; padding: 16px 22px; gap: 20px; }
    #sideCol { order: 1; }
    #padCol { order: 2; }
    #bottomSpacer { display: none; }
  }
</style>
</head>
<body>

<!-- SKETCH VIEW -->
<div id="sketchView">
  <div id="leftCol">
    <div id="canvasWrap"><div id="canvasInner"></div></div>

    <div id="titleRow">
      <input id="titleInput" placeholder="Sketch title" />
      <button id="saveBtn">Save</button>
    </div>
  </div>

  <div id="bottomRow">
    <div id="sideCol">
      <button id="sketchesTabBtn">Sketches</button>
      <div id="undoClearRow">
        <button id="undoBtn">Undo</button>
        <button id="clearBtn">Clear</button>
      </div>
      <button id="micBtn" style="display:none;">🎤 Voice Commands</button>
      <label id="snapToggleRow">
        <span id="snapToggleLabel">Snap to Grid</span>
        <span class="switch">
          <input type="checkbox" id="snapToggle" />
          <span class="slider"></span>
        </span>
      </label>
      <label id="maintainArcToggleRow">
        <span class="snapToggleLabel">Maintain arc length</span>
        <span class="switch">
          <input type="checkbox" id="maintainArcToggle" />
          <span class="slider"></span>
        </span>
      </label>
    </div>
    <div id="padCol">
      <div id="arcBtnRow">
        <button id="semicircleBtn" title="Semicircle" aria-label="Semicircle">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4 18 A8 8 0 0 1 20 18" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.5 2.2" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="arcHeightUpBtn" title="Increase arc height" aria-label="Increase arc height">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4 18 A8 8 0 0 1 20 18" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.5 2.2" stroke-linecap="round"/>
            <path d="M12 9 V3 M9 6 L12 3 L15 6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="arcHeightDownBtn" title="Decrease arc height" aria-label="Decrease arc height">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4 18 A8 8 0 0 1 20 18" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.5 2.2" stroke-linecap="round"/>
            <path d="M12 9 V3 M9 6 L12 9 L15 6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div id="pad">
      <button class="arrowBtn" data-dir="ul">↖</button>
      <button class="arrowBtn" data-dir="u">↑</button>
      <button class="arrowBtn" data-dir="ur">↗</button>
      <button class="arrowBtn" data-dir="l">←</button>
      <input id="numberInput" inputmode="numeric" placeholder="0"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             name="sketch-length-field" data-lpignore="true" data-form-type="other" />
      <button class="arrowBtn" data-dir="r">→</button>
      <button class="arrowBtn" data-dir="dl">↙</button>
      <button class="arrowBtn" data-dir="d">↓</button>
      <button class="arrowBtn" data-dir="dr">↘</button>
      </div>
    </div>
  </div>
  <div id="bottomSpacer"></div>
</div>

<!-- SKETCHES LIST VIEW -->
<div id="sketchesView">
  <div id="sketchesHeader">
    <button id="backBtn">← Back</button>
    <div id="sketchesCount">Sketches (0)</div>
  </div>
  <div id="sketchesActions">
    <button id="exportBtn">Export All (CSV)</button>
    <button id="deleteAllBtn">Delete All</button>
  </div>
  <div id="sketchesList"></div>
</div>

<div id="modalOverlay">
  <div id="modalBox">
    <div id="modalLabel">Confirm</div>
    <p id="modalMessage"></p>
    <div id="modalActions">
      <button id="modalCancel">Cancel</button>
      <button id="modalConfirm">Delete</button>
    </div>
  </div>
</div>

<div id="exportOverlay">
  <div id="exportBox">
    <div id="exportLabel">Export CSV</div>
    <p id="exportHint">Sharing isn't available here - copy the CSV below instead.</p>
    <textarea id="exportTextarea" readonly></textarea>
    <div id="exportActions">
      <button id="exportCloseBtn">Close</button>
      <button id="exportCopyBtn">Copy to Clipboard</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "sketchMeasureApp:sketches";

  var DIRS = {
    u:  { label: "↑", dx: 0, dy: -1 },
    ur: { label: "↗", dx: 0.7071, dy: -0.7071 },
    r:  { label: "→", dx: 1, dy: 0 },
    dr: { label: "↘", dx: 0.7071, dy: 0.7071 },
    d:  { label: "↓", dx: 0, dy: 1 },
    dl: { label: "↙", dx: -0.7071, dy: 0.7071 },
    l:  { label: "←", dx: -1, dy: 0 },
    ul: { label: "↖", dx: -0.7071, dy: -0.7071 }
  };
  var PAD_LAYOUT = ["ul", "u", "ur", "l", null, "r", "dl", "d", "dr"];
  var DIR_RE = /^(\d+(?:\.\d+)?)(ur|ul|dr|dl|u|d|l|r)$/;
  var COMPOUND_DIR_RE = /^(\d+)(u|d|l|r)(\d+)(u|d|l|r)$/;
  var DIAGONAL_DIRS = { ur: true, ul: true, dr: true, dl: true };
  var SQRT2 = Math.sqrt(2);
  var SNAP_DECIMAL = 1.41;
  var SEMI_FACTOR = 1.57;
  var ARC_COLOR = "#8C6A45";
  var START_COLOR = "#A63D40";
  var END_COLOR = "#3F7A52";
  var SNAP_KEY = "sketchMeasureApp:snapToGrid";
  var MAINTAIN_ARC_KEY = "sketchMeasureApp:maintainArcLength";

  // Round to at most 2 decimals and print without trailing zeros (e.g. 9.9, not 9.90).
  function formatNumber(v) {
    return (Math.round(v * 100) / 100).toString();
  }

  // For a diagonal segment, round the entered length to the nearest multiple
  // of sqrt(2) - the true corner-to-corner distance across a unit grid square.
  function snapDiagonal(n) {
    var snapped = Math.round(n / SQRT2) * SQRT2;
    if (snapped <= 0) snapped = SQRT2;
    return Math.round(snapped * 100) / 100;
  }

  // ---------- state ----------
  var state = {
    segments: [],
    title: "",
    numberInput: "",
    sketches: loadSketches(),
    view: "sketch",
    snapToGrid: loadSnapPref(),
    maintainArcLength: loadMaintainArcPref(),
    editingSketchId: null
  };

  function loadSnapPref() {
    try {
      var raw = localStorage.getItem(SNAP_KEY);
      return raw === null ? true : raw === "1"; // defaults to on
    } catch (e) {
      return true;
    }
  }
  function persistSnapPref() {
    try {
      localStorage.setItem(SNAP_KEY, state.snapToGrid ? "1" : "0");
    } catch (e) {
      console.error("Persist snap pref error:", e);
    }
  }

  function loadMaintainArcPref() {
    try {
      var raw = localStorage.getItem(MAINTAIN_ARC_KEY);
      return raw === null ? true : raw === "1"; // defaults to on
    } catch (e) {
      return true;
    }
  }
  function persistMaintainArcPref() {
    try {
      localStorage.setItem(MAINTAIN_ARC_KEY, state.maintainArcLength ? "1" : "0");
    } catch (e) {
      console.error("Persist maintain-arc pref error:", e);
    }
  }

  // ---------- storage (fully local, on-device) ----------
  function loadSketches() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var list = raw ? JSON.parse(raw) : [];
      list.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
      return list;
    } catch (e) {
      console.error("Load error:", e);
      return [];
    }
  }
  function persistSketches() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.sketches));
    } catch (e) {
      console.error("Persist error:", e);
      showToast("Couldn't save on this device (storage full or blocked)");
    }
  }

  function genId() {
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  function parseMeasurements(str) {
    if (!str) return [];
    var result = [];
    str.split(",").map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (tok) {
      var single = tok.match(DIR_RE);
      if (single) {
        result.push({ value: parseFloat(single[1]), dir: single[2] });
        return;
      }
      // A snapped diagonal is stored as two whole-number orthogonal legs
      // concatenated with no comma between them (e.g. "5u5r"). Both legs
      // came from the same diagonal move and land at the same endpoint
      // either way, so recombine them into a single diagonal segment for
      // drawing - otherwise it renders as an L-shaped corner instead of
      // the actual diagonal line.
      var compound = tok.match(COMPOUND_DIR_RE);
      if (compound) {
        var v1 = parseFloat(compound[1]), l1 = compound[2];
        var v2 = parseFloat(compound[3]), l2 = compound[4];
        var vertical = (l1 === "u" || l1 === "d") ? l1 : ((l2 === "u" || l2 === "d") ? l2 : null);
        var horizontal = (l1 === "l" || l1 === "r") ? l1 : ((l2 === "l" || l2 === "r") ? l2 : null);
        if (vertical && horizontal && v1 === v2) {
          result.push({ value: v1 * SQRT2, dir: vertical + horizontal, snapped: true, snapComponent: v1 });
        } else {

    return segments.map(function (s) {
      if (s.snapped && DIAGONAL_DIRS[s.dir]) {

      }
      return formatNumber(s.value) + s.dir;

  }
  function computePoints(segments) {
    var pts = [{ x: 0, y: 0 }];
    segments.forEach(function (s) {
      var d = DIRS[s.dir];
      var last = pts[pts.length - 1];
      pts.push({ x: last.x + d.dx * s.value, y: last.y + d.dy * s.value });
    });
    return pts;
  }

  // ---------- svg rendering ----------
  function renderSketchSVG(segments, size, pad, showOrigin, showLabels) {
    size = size || 300; pad = pad === undefined ? 28 : pad;
    var pts = computePoints(segments);
    var xs = pts.map(function (p) { return p.x; });
    var ys = pts.map(function (p) { return p.y; });
    var minX = Math.min(0, Math.min.apply(null, xs));
    var maxX = Math.max(0, Math.max.apply(null, xs));
    var minY = Math.min(0, Math.min.apply(null, ys));
    var maxY = Math.max(0, Math.max.apply(null, ys));
    var rangeX = Math.max(maxX - minX, 1);
    var rangeY = Math.max(maxY - minY, 1);
    var drawable = size - pad * 2;
    var scale = Math.min(drawable / rangeX, drawable / rangeY);
    var cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    function toScreen(p) {
      return { x: size / 2 + (p.x - cx) * scale, y: size / 2 + (p.y - cy) * scale };
    }
    var screenPts = pts.map(toScreen);
    var pathD = screenPts.map(function (p, i) {
      return (i === 0 ? "M " : "L ") + p.x.toFixed(2) + " " + p.y.toFixed(2);
    }).join(" ");

    var svg = '<svg viewBox="0 0 ' + size + ' ' + size + '" width="100%" height="100%">';
    svg += '<rect x="0" y="0" width="' + size + '" height="' + size + '" fill="#E8E2D2"/>';
    if (segments.length > 0) {
      svg += '<path d="' + pathD + '" fill="none" stroke="#28405E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';

      // a dot on both ends of every segment (i.e. every vertex, including the
      // origin). The very first vertex (start of the first segment) is red,
      // the very last vertex (end of the most recent segment) is green, so
      // it's always clear which end is which - even in a small thumbnail.
      var dotR = size <= 80 ? 2 : 3.5;
      var lastIdx = screenPts.length - 1;
      screenPts.forEach(function (p, i) {
        var fill = "#212A38", r = dotR;
        if (i === 0) { fill = START_COLOR; r = dotR + 0.8; }
        else if (i === lastIdx) { fill = END_COLOR; r = dotR + 0.8; }
        svg += '<circle cx="' + p.x.toFixed(2) + '" cy="' + p.y.toFixed(2) + '" r="' + r + '" fill="' + fill + '"/>';
      });

      // dashed arc for any segment marked .arc, bulging away from the
      // sketch's center, connecting that segment's two endpoints. Its
      // height (sagitta) defaults to a true semicircle but can be adjusted
      // independently via the arc-height buttons, which changes the sweep
      // (shallower than a semicircle, or a fuller major arc) while always
      // still meeting the segment's actual endpoints exactly.
      segments.forEach(function (s, i) {
        if (!s.arc) return;
        var p0d = pts[i], p1d = pts[i + 1];
        var mcx = (p0d.x + p1d.x) / 2, mcy = (p0d.y + p1d.y) / 2; // chord midpoint
        var cdx = p1d.x - p0d.x, cdy = p1d.y - p0d.y;
        var clen = Math.sqrt(cdx * cdx + cdy * cdy) || 1;
        var nx, ny;
        if (typeof s.arcNx === "number" && typeof s.arcNy === "number") {
          // use the direction locked in when the arc was created, so it
          // doesn't shift as later segments move the sketch's center
          nx = s.arcNx; ny = s.arcNy;
        } else {
          var perpX = -cdy / clen, perpY = cdx / clen;
          var outX = mcx - cx, outY = mcy - cy;
          var dot = perpX * outX + perpY * outY;
          nx = dot >= 0 ? perpX : -perpX;
          ny = dot >= 0 ? perpY : -perpY;
        }
        if (s.arcFlip) { nx = -nx; ny = -ny; }

        var half = clen / 2;
        var h = (typeof s.arcHeight === "number" && s.arcHeight > 0) ? s.arcHeight : half;
        var r = (h * h + half * half) / (2 * h);
        var centerX = mcx + (h - r) * nx, centerY = mcy + (h - r) * ny;

        var ang0 = Math.atan2(p0d.y - centerY, p0d.x - centerX);
        var ang1 = Math.atan2(p1d.y - centerY, p1d.x - centerX);
        var apexAngle = Math.atan2(ny, nx);
        var diff = apexAngle - ang0;
        while (diff <= -Math.PI) diff += 2 * Math.PI;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        var sweepDir = diff >= 0 ? 1 : -1;
        var sweepAmt = ang1 - ang0;
        if (sweepDir > 0) {
          while (sweepAmt <= 0) sweepAmt += 2 * Math.PI;
          while (sweepAmt > 2 * Math.PI) sweepAmt -= 2 * Math.PI;
        } else {
          while (sweepAmt >= 0) sweepAmt -= 2 * Math.PI;
          while (sweepAmt < -2 * Math.PI) sweepAmt += 2 * Math.PI;
        }
        var totalSweep = Math.abs(sweepAmt);

        var steps = 24;
        var arcScreenPts = [];
        for (var k = 0; k <= steps; k++) {
          var theta = ang0 + sweepDir * totalSweep * (k / steps);
          arcScreenPts.push(toScreen({ x: centerX + r * Math.cos(theta), y: centerY + r * Math.sin(theta) }));
        }
        var arcPathD = arcScreenPts.map(function (p, ix) {
          return (ix === 0 ? "M " : "L ") + p.x.toFixed(2) + " " + p.y.toFixed(2);
        }).join(" ");
        svg += '<path d="' + arcPathD + '" fill="none" stroke="' + ARC_COLOR + '" stroke-width="1.6" stroke-dasharray="4 3" stroke-linecap="round"/>';

        if (showLabels) {
          var apexScreen = toScreen({ x: mcx + h * nx, y: mcy + h * ny });
          var midScreen = toScreen({ x: mcx, y: mcy });
          var ddx = apexScreen.x - midScreen.x, ddy = apexScreen.y - midScreen.y;
          var dlen = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
          var lx = apexScreen.x + (ddx / dlen) * 10, ly = apexScreen.y + (ddy / dlen) * 10;
          var arcLabel = formatNumber(r * totalSweep);
          var aw = arcLabel.length * 6.5 + 6;
          svg += '<rect x="' + (lx - aw / 2).toFixed(2) + '" y="' + (ly - 8).toFixed(2) + '" width="' + aw.toFixed(2) + '" height="13" fill="#F2EEE3" opacity="0.9" rx="2"/>';
          svg += '<text x="' + lx.toFixed(2) + '" y="' + (ly + 2.5).toFixed(2) + '" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="' + ARC_COLOR + '">' + arcLabel + '</text>';
        }
      });

      // a measurement number beside each line segment, offset off the line
      // (shown for every segment, including ones with a dashed arc, which
      // additionally get their arc-length label near the arc itself above)
      if (showLabels) {
        segments.forEach(function (s, i) {
          var p0 = screenPts[i], p1 = screenPts[i + 1];
          var mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
          var dx = p1.x - p0.x, dy = p1.y - p0.y;
          var len = Math.sqrt(dx * dx + dy * dy) || 1;
          var nx = -dy / len, ny = dx / len;
          var offset = 13;
          var lx = mx + nx * offset, ly = my + ny * offset;
          var label = formatNumber(s.value);
          var w = label.length * 6.5 + 6;
          svg += '<rect x="' + (lx - w / 2).toFixed(2) + '" y="' + (ly - 8).toFixed(2) + '" width="' + w.toFixed(2) + '" height="13" fill="#F2EEE3" opacity="0.9" rx="2"/>';
          svg += '<text x="' + lx.toFixed(2) + '" y="' + (ly + 2.5).toFixed(2) + '" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#28405E">' + label + '</text>';
        });
      }
    } else {
      svg += '<text x="' + (size / 2) + '" y="' + (size / 2 + 4) + '" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5B6577">no lines yet</text>';
    }
    svg += '</svg>';
    return svg;
  }

  // Semicircle: replaces the last segment's value with (value / 1.57), i.e.
  // converts a quarter-circle arc length back to its straight chord length.
  // Orthogonal segments round to a whole number only if Snap to Grid is on;
  // diagonal (corner) segments always round to the nearest multiple of sqrt(2).
  // Semicircle: first tap replaces the last segment's value with (value /
  // 1.57), i.e. converts a quarter-circle arc length back to its straight
  // chord length, and draws the dashed arc. Corner (diagonal) segments only
  // snap to the nearest multiple of sqrt(2) when Snap to Grid is on;
  // orthogonal segments only round to a whole number under the same
  // condition. Subsequent taps (once the segment already has an arc) don't
  // change the value again - they just flip which side the arc bulges.
  // ---------- arc geometry: chord <-> height <-> true arc length ----------
  // Forward: given chord length L and sagitta (height) h, returns the true
  // geometric length along the curve (r * theta). Used so the displayed arc
  // length is always mathematically consistent with the shape actually drawn.
  function trueArcLength(L, h) {
    var half = L / 2;
    if (h <= 0 || half <= 0) return L;
    var r = (h * h + half * half) / (2 * h);
    var ratio = Math.min(1, half / r);
    var theta = 2 * Math.asin(ratio);
    if (h > half) theta = 2 * Math.PI - theta; // major arc (more than a semicircle)
    return r * theta;
  }
  // Inverse: given a target true arc length s and a chord length L (L must be
  // < s, since a straight chord is always shorter than any curve between its
  // endpoints), solves for the sagitta h whose arc has that exact length.
  function solveHeightForChord(s, L) {
    if (L >= s) return 0.001;
    function f(theta) { return 2 * s * Math.sin(theta / 2) - L * theta; }
    var lo = 1e-6, hi = 2 * Math.PI - 1e-6;
    for (var i = 0; i < 100; i++) {
      var mid = (lo + hi) / 2;
      if (f(mid) > 0) lo = mid; else hi = mid;
    }
    var theta = (lo + hi) / 2;
    var r = s / theta;
    return r * (1 - Math.cos(theta / 2));
  }

  // Computes the "away from the sketch's center" perpendicular direction for
  // segment index i, based on the shape as it exists right now. Called once
  // when an arc is created so that direction can be locked in and stays put
  // even as later segments shift the sketch's overall bounding-box center.
  function computeOutwardNormal(segments, index) {
    var pts = computePoints(segments);
    var xs = pts.map(function (p) { return p.x; });
    var ys = pts.map(function (p) { return p.y; });
    var minX = Math.min(0, Math.min.apply(null, xs));
    var maxX = Math.max(0, Math.max.apply(null, xs));
    var minY = Math.min(0, Math.min.apply(null, ys));
    var maxY = Math.max(0, Math.max.apply(null, ys));
    var ccx = (minX + maxX) / 2, ccy = (minY + maxY) / 2;
    var p0d = pts[index], p1d = pts[index + 1];
    var mcx = (p0d.x + p1d.x) / 2, mcy = (p0d.y + p1d.y) / 2;
    var cdx = p1d.x - p0d.x, cdy = p1d.y - p0d.y;
    var clen = Math.sqrt(cdx * cdx + cdy * cdy) || 1;
    var perpX = -cdy / clen, perpY = cdx / clen;
    var outX = mcx - ccx, outY = mcy - ccy;
    var dot = perpX * outX + perpY * outY;
    return { nx: dot >= 0 ? perpX : -perpX, ny: dot >= 0 ? perpY : -perpY };
  }

  semicircleBtn.addEventListener("click", function () {
    if (state.segments.length === 0) return;
    var last = state.segments[state.segments.length - 1];

    if (last.arc) {
      last.arcFlip = !last.arcFlip;
      renderCanvas();
      return;
    }
    if (state.maintainArcLength) {
      // Normal behavior: the segment's own length becomes value/1.57.
      var divided = last.value / SEMI_FACTOR;
      var newValue;
      if (DIAGONAL_DIRS[last.dir]) {

          newValue = snapDiagonal(divided);
          last.snapped = true;
          last.snapComponent = Math.max(1, Math.round(divided / SNAP_DECIMAL));
        } else {
          newValue = Math.round(divided);
          last.snapped = false;
        }
      } else {
        newValue = Math.round(divided);
      }
      if (!(newValue > 0)) {

      }
      last.value = newValue;

    last.arc = true;

    last.arcNx = normal.nx;
    last.arcNy = normal.ny;

  // When Maintain Arc Length is on, the height buttons adjust the actual
  // segment length by 1 unit each tap (keeping the arc a true semicircle
  // proportional to that length). A snapped diagonal adjusts its whole-
  // number leg component instead, to keep the exported string valid.
  // Height goes up/down by 1 unit each tap; the arc's length (originally
  // typed number) stays as the fixed target, and the segment's straight
  // length is re-derived to match that height - shrinking (and looking more
  // circular) as height increases, per the solver above. Snap to Grid still
  // governs how the resulting length gets rounded.
  // When Maintain Arc Length is ON, Up/Down step the segment's actual length
  // by a fixed amount (1 unit, or for a snapped diagonal exactly sqrt(2) via
  // its whole-number leg component, which displays as "1.41"), then re-solve
  // the height so the arc's true length stays as close as possible to the
  // number originally typed to create the segment. Length is bounded between
  // its minimum (1, or 1.41 for a snapped diagonal) and that original number.

    var isDiag = DIAGONAL_DIRS[seg.dir];

    if (isDiag && state.snapToGrid) {
      var comp = typeof seg.snapComponent === "number" ? seg.snapComponent : Math.round(seg.value / SQRT2);
      var maxComp = Math.max(1, Math.floor(targetS / SQRT2 + 1e-9));
      comp = Math.max(1, Math.min(maxComp, comp - 1));
      seg.snapComponent = comp;
      seg.snapped = true;
      newValue = Math.round(comp * SQRT2 * 100) / 100;
    } else {
      newValue = Math.max(1, Math.min(targetS, Math.round((seg.value - 1) * 100) / 100));
      if (isDiag) seg.snapped = false;
    }
    seg.value = newValue;
    seg.arcHeight = solveHeightForChord(targetS, newValue);
  }
  function stepLengthTowardMaximum(seg, targetS) {
    var isDiag = DIAGONAL_DIRS[seg.dir];
    var newValue;
    if (isDiag && state.snapToGrid) {
      var comp = typeof seg.snapComponent === "number" ? seg.snapComponent : Math.round(seg.value / SQRT2);
      var maxComp = Math.max(1, Math.floor(targetS / SQRT2 + 1e-9));
      comp = Math.max(1, Math.min(maxComp, comp + 1));
      seg.snapComponent = comp;
      seg.snapped = true;
      newValue = Math.round(comp * SQRT2 * 100) / 100;
    } else {
      newValue = Math.max(1, Math.min(targetS, Math.round((seg.value + 1) * 100) / 100));
      if (isDiag) seg.snapped = false;
    }
    seg.value = newValue;
    seg.arcHeight = solveHeightForChord(targetS, newValue);
  }

  // When Maintain Arc Length is OFF, the segment's length never changes;
  // instead the arc's true length itself steps by 1 unit, and height is
  // re-solved for that same fixed chord. Won't go below 1 unit of height.
  function stepArcLengthOnly(seg, delta) {
    var currentHeight = typeof seg.arcHeight === "number" ? seg.arcHeight : seg.value / 2;
    var currentArcLen = trueArcLength(seg.value, currentHeight);
    var newArcLen = currentArcLen + delta;
    var newHeight = solveHeightForChord(Math.max(newArcLen, seg.value + 0.001), seg.value);
    if (delta < 0 && newHeight < 1) {
      seg.arcHeight = 1;
    } else {
      seg.arcHeight = newHeight;
    }
  }

  arcHeightUpBtn.addEventListener("click", function () {

    var last = state.segments[state.segments.length - 1];

      var s = typeof last.originalValue === "number" ? last.originalValue : last.value;
      stepLengthTowardMinimum(last, s);
    } else {
      stepArcLengthOnly(last, 1);

  // ---------- voice commands ("12 up", "10 up right", etc.) ----------
  // Only appears where the browser actually supports SpeechRecognition
  // (Chrome/Android; not Safari/iOS, and not guaranteed inside every

  var micBtn = document.getElementById("micBtn");
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;
  var listening = false;

  var NUMBER_WORDS = {
    zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7,
    eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13,
    fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18,
    nineteen: 19, twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60,

  };
  function wordsToNumber(text) {
    var words = text.split(/\s+/);
    var total = null;
    for (var i = 0; i < words.length; i++) {
      var w = words[i].replace(/[^a-z]/g, "");
      if (Object.prototype.hasOwnProperty.call(NUMBER_WORDS, w)) {
        var v = NUMBER_WORDS[w];
        if (total !== null && v < 10 && total >= 20 && total % 10 === 0) total += v; // "twenty five"
        else total = v;

  }
  function parseVoiceCommand(raw) {
    var text = raw.toLowerCase().trim();
    // normalize concatenated forms ("upright", "downleft") to spaced ones
    // so the same up/down/left/right detection below catches them too
    text = text.replace(/\b(up|down)(right|left)\b/g, "$1 $2");
    var n = null;
    var digitMatch = text.match(/\d+/);
    if (digitMatch) n = parseInt(digitMatch[0], 10);
    else n = wordsToNumber(text);
    if (!n || n <= 0) return null;

    var vert = /\bup\b/.test(text) ? "u" : (/\bdown\b/.test(text) ? "d" : "");
    var horiz = /\bleft\b/.test(text) ? "l" : (/\bright\b/.test(text) ? "r" : "");
    var dir = vert + horiz;
    if (!dir || !DIRS[dir]) return null;
    return { n: n, dir: dir };
  }

  function handleVoiceTranscript(transcript) {
    var text = transcript.toLowerCase().trim();
    if (/\bundo\b/.test(text)) {
      if (state.segments.length === 0) {
        showToast("Nothing to undo");
        return;
      }
      state.segments.pop();
      renderCanvas();
      updateUndoClearState();
      showToast("Undo");
      return;
    }
    var cmd = parseVoiceCommand(transcript);
    if (!cmd) {
      showToast('Didn\'t catch that: "' + transcript.trim() + '"');
      return;
    }
    state.numberInput = String(cmd.n);
    handleArrowTap(cmd.dir);
    showToast("Added " + cmd.n + " " + DIRS[cmd.dir].label);
  }

  function setMicUI(isListening) {
    micBtn.classList.toggle("listening", isListening);
    micBtn.textContent = isListening ? "● Listening - tap to stop" : "🎤 Voice Commands";
  }

  function initRecognition() {
    recognition = new SpeechRecognitionCtor();
    recognition.lang = "en-US";
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onresult = function (e) {
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          handleVoiceTranscript(e.results[i][0].transcript);
        }
      }
    };
    recognition.onerror = function (e) {
      console.warn("Speech recognition error:", e.error);
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        showToast("Microphone access denied");
        stopListening();
      }
    };
    recognition.onend = function () {
      // Chrome often ends the session after a pause even with continuous
      // mode on - restart automatically as long as we're still "listening".
      if (listening) {
        try { recognition.start(); } catch (e) {}
      }
    };
  }

  function startListening() {
    if (!recognition) initRecognition();
    listening = true;
    setMicUI(true);
    try { recognition.start(); } catch (e) {}
  }
  function stopListening() {
    listening = false;
    setMicUI(false);
    if (recognition) { try { recognition.stop(); } catch (e) {} }
  }

  if (SpeechRecognitionCtor) {
    micBtn.style.display = "block";
    micBtn.addEventListener("click", function () {
      if (listening) stopListening(); else startListening();
    });
  }

  titleInput.addEventListener("input", function () { state.title = titleInput.value; });

  saveBtn.addEventListener("click", function () {
    if (state.segments.length === 0) {
      showToast("Add at least one line");
      return;
    }
    var finalTitle = state.title.trim() || "Untitled sketch";
    var measurementsStr = segmentsToString(state.segments);
    var segmentsCopy = JSON.parse(JSON.stringify(state.segments));

    if (state.editingSketchId) {
      var idx = -1;
      for (var i = 0; i < state.sketches.length; i++) {
        if (state.sketches[i].id === state.editingSketchId) { idx = i; break; }
      }
      if (idx !== -1) {
        state.sketches[idx].title = finalTitle;
        state.sketches[idx].measurements = measurementsStr;
        state.sketches[idx].segments = segmentsCopy;
        persistSketches();
        showToast("Sketch updated");
        return; // keep drawing from where you left off - no reset
      }
      // the sketch being edited no longer exists (e.g. deleted) - fall
      // through and save as a new sketch instead
      state.editingSketchId = null;
    }

    var record = {
      id: genId(),
      title: finalTitle,
      measurements: measurementsStr,
      segments: segmentsCopy,
      createdAt: Date.now()
    };
    state.sketches.unshift(record);
    persistSketches();
    state.segments = [];
    state.title = "";
    titleInput.value = "";
    renderCanvas();
    updateUndoClearState();
    showToast("Sketch saved");
  });

  // ---------- sketches list view ----------
  var sketchView = document.getElementById("sketchView");
  var sketchesView = document.getElementById("sketchesView");
  var sketchesCount = document.getElementById("sketchesCount");
  var sketchesList = document.getElementById("sketchesList");
  var backBtn = document.getElementById("backBtn");
  var exportBtn = document.getElementById("exportBtn");
  var deleteAllBtn = document.getElementById("deleteAllBtn");

  sketchesTabBtn.addEventListener("click", function () {
    if (listening) stopListening();
    state.view = "sketches";
    sketchView.style.display = "none";
    sketchesView.style.display = "flex";
    renderSketchesList();
  });
  backBtn.addEventListener("click", function () {
    state.view = "sketch";
    sketchesView.style.display = "none";
    sketchView.style.display = "flex";
  });

  function sketchSegments(s) {
    // Prefer the full stored segments (preserves arcs, snap metadata, etc.);
    // fall back to re-parsing the plain string for older saved sketches.
    if (s.segments && s.segments.length) return s.segments;
    return parseMeasurements(s.measurements);
  }

  function loadSketchForEditing(s) {
    state.segments = JSON.parse(JSON.stringify(sketchSegments(s)));
    state.title = s.title;
    state.editingSketchId = s.id;
    titleInput.value = s.title;
    state.view = "sketch";
    sketchesView.style.display = "none";
    sketchView.style.display = "flex";
    renderCanvas();
    updateUndoClearState();
  }

  function renderSketchesList() {
    sketchesCount.textContent = "Sketches (" + state.sketches.length + ")";
    sketchesList.innerHTML = "";
    if (state.sketches.length === 0) {
      var empty = document.createElement("div");
      empty.className = "emptyState";
      empty.textContent = "No sketches saved yet.";
      sketchesList.appendChild(empty);
      return;
    }
    state.sketches.forEach(function (s) {
      var row = document.createElement("div");
      row.className = "sketchRow";

      var thumb = document.createElement("div");
      thumb.className = "sketchThumb";
      thumb.style.cursor = "pointer";
      thumb.innerHTML = renderSketchSVG(sketchSegments(s), 56, 8, false);
      thumb.addEventListener("click", function () { loadSketchForEditing(s); });

      var meta = document.createElement("div");
      meta.className = "sketchMeta";
      var t = document.createElement("div");
      t.className = "sketchTitle";
      t.textContent = s.title;
      var m = document.createElement("div");
      m.className = "sketchMeasurements";
      m.textContent = s.measurements;
      meta.appendChild(t);
      meta.appendChild(m);

      var delBtn = document.createElement("button");
      delBtn.className = "sketchDeleteBtn";
      delBtn.textContent = "Delete";
      delBtn.addEventListener("click", function () {
        openConfirm("Are you sure you want to delete " + s.title + "?", function () {
          state.sketches = state.sketches.filter(function (x) { return x.id !== s.id; });
          if (state.editingSketchId === s.id) state.editingSketchId = null;
          persistSketches();
          showToast("Deleted");
          renderSketchesList();
        });
      });

      row.appendChild(thumb);
      row.appendChild(meta);
      row.appendChild(delBtn);
      sketchesList.appendChild(row);
    });
  }

  deleteAllBtn.addEventListener("click", function () {
    if (state.sketches.length === 0) return;
    openConfirm("Are you sure you want to delete all the sketches?", function () {
      state.sketches = [];
      state.editingSketchId = null;
      persistSketches();
      showToast("All sketches deleted");
      renderSketchesList();
    });
  });

  var exportOverlay = document.getElementById("exportOverlay");
  var exportTextarea = document.getElementById("exportTextarea");
  var exportCloseBtn = document.getElementById("exportCloseBtn");
  var exportCopyBtn = document.getElementById("exportCopyBtn");

  function showExportModal(csv) {
    exportTextarea.value = csv;
    exportOverlay.style.display = "flex";
    exportTextarea.focus();
    exportTextarea.select();
  }
  exportCloseBtn.addEventListener("click", function () {
    exportOverlay.style.display = "none";
  });
  exportCopyBtn.addEventListener("click", function () {
    exportTextarea.focus();
    exportTextarea.select();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(exportTextarea.value).then(function () {
        showToast("Copied to clipboard");
      }).catch(function () {
        try {
          document.execCommand("copy");
          showToast("Copied to clipboard");
        } catch (e) {
          showToast("Select the text and copy manually");
        }
      });
    } else {
      try {
        document.execCommand("copy");
        showToast("Copied to clipboard");
      } catch (e) {
        showToast("Select the text and copy manually");
      }
    }
  });

  exportBtn.addEventListener("click", function () {
    if (state.sketches.length === 0) {
      showToast("No sketches to export");
      return;
    }
    function escape(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
    var rows = [["Title", "Measurements"].map(escape).join(",")];
    state.sketches.forEach(function (s) {
      rows.push([s.title, s.measurements].map(escape).join(","));
    });
    var csv = rows.join("\r\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });

    var now = new Date();
    var datePart = now.getFullYear() + "-" +
      String(now.getMonth() + 1).padStart(2, "0") + "-" +
      String(now.getDate()).padStart(2, "0");
    var fileName = "Sketch Helper " + datePart + ".csv";

    var file;
    try { file = new File([blob], fileName, { type: "text/csv" }); } catch (e) { file = null; }

    if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: fileName }).catch(function (e) {
        if (e && e.name === "AbortError") return;
        console.warn("Share failed, showing manual export:", e);
        showExportModal(csv);
      });
      return;
    }

    // No native share support - this is the common case inside web-view
    // based app wrappers, where a JS-triggered blob/anchor download is
    // frequently blocked silently with no error. Showing the CSV directly
    // for copy/paste works virtually everywhere, including those wrappers.
    showExportModal(csv);
  });

  // ---------- init ----------
  renderCanvas();
  renderPad();
  updateUndoClearState();

  // Register service worker for offline use, if hosted over http(s).
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(function (e) {
      console.warn("Service worker registration failed:", e);
    });
  }
})();
</script>
</body>
</html>
